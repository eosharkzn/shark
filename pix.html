<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live PIX</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');


*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}


body{
    background:#0d0d0d;
    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}


.container{

    width:100%;
    max-width:420px;
    text-align:center;

}


.avatar{

    width:110px;
    height:110px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid rgba(255,255,255,.12);
    margin-bottom:20px;

}


h1{

    font-size:28px;
    font-weight:600;
    margin-bottom:8px;

}


.bio{

    color:#9b9b9b;
    margin-bottom:30px;

}


.pix-card{

    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;

    padding:25px;

    backdrop-filter:blur(20px);

}


.pix-card i{

    font-size:45px;
    margin-bottom:15px;

}


.pix-card h2{

    font-size:22px;
    margin-bottom:10px;

}


.pix-card p{

    color:#9b9b9b;
    font-size:14px;
    margin-bottom:20px;

}


.pix-key{
    background:rgba(255,255,255,.08);
    padding:15px;
    border-radius:14px;

    font-size:13px;
    line-height:18px;

    color:#fff;

    word-break:break-all;

    max-height:80px;
    overflow:auto;

    margin-bottom:15px;
}


.button{

    width:100%;
    height:55px;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;

    background:rgba(255,255,255,.05);

    border:1px solid rgba(255,255,255,.08);

    border-radius:18px;

    color:white;

    text-decoration:none;

    font-size:16px;

    cursor:pointer;

    transition:.25s;

}


.button:hover{

    background:rgba(255,255,255,.12);

}

.qrcode{
    width:200px;
    height:200px;
    object-fit:contain;
    border-radius:15px;
    background:white;
    padding:10px;
    margin-bottom:20px;
}



</style>


</head>


<body>


<div class="container">


<img src="sua-foto.jpg" class="avatar">


<h1>@eoshark._.zn</h1>


<p class="bio">
Faça sua contribuição pelo PIX
</p>


<div class="pix-card">

<img src="qrcode.jpeg" class="qrcode">

<h2>LIVE PIX</h2>
<p>
Clique abaixo para copiar a chave PIX
</p>



<div class="pix-key" id="pix">
00020101021126330014br.gov.bcb.pix0111058614101435204000053039865802BR5916DAVI SOUSA SILVA6010PLANALTINA62070503***6304112B
</div>



<button class="button" onclick="copiarPix()">

<i class="fa-solid fa-copy"></i>

Copiar PIX

</button>


</div>



<br>


<a href="eosharkzn.html" class="button">

<i class="fa-solid fa-arrow-left"></i>

Voltar

</a>



</div>



<script>

function copiarPix(){

let pix = document.getElementById("pix").innerText;

navigator.clipboard.writeText(pix);

alert("PIX copiado!");

}

</script>


</body>

</html>
